name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a preinstalled Android SDK (ANDROID_HOME
      # and sdkmanager already on PATH) - just fetch the extra components
      # this project needs. Avoids android-actions/setup-android, which
      # currently fails trying to install the removed legacy "tools" package.
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: biblioscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
